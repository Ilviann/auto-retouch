[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retouching-tool"
version = "0.1.0"
description = "Auto ReTouch, local Windows portrait workflow"
authors = [{name = "Neyrome"}]
requires-python = ">=3.14,<3.15"
dependencies = ["PySide6-Essentials==6.12.0", "numpy==2.5.5", "Pillow==13.0.0", "tifffile==2026.10.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"retouching_tool.operations.alibaba_networks" = ["LICENSE"]
